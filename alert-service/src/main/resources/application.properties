server.port=8085

spring.application.name=alert-service

# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5433/alertdb
spring.datasource.username=postgres
spring.datasource.password=sabrine123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# Kafka — Consumer
# =========================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=alert-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.digitaltwin.alert_service.kafka,com.digitaltwin.building_service.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.digitaltwin.alert_service.kafka.SensorReadingEvent

# =========================
# Topic (meme que building-service)
# =========================
alert.kafka.topic=building.sensor.readings

# =========================
# Cooldown anti-spam alertes (10 min en ms)
# =========================
alert.cooldown.ms=600000
