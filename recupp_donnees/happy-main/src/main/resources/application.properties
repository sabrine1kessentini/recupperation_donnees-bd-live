server.port=8084

# =========================
# Application
# =========================
spring.application.name=building-service

# =========================
# Datasource (PostgreSQL)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5433/buildingdb
spring.datasource.username=postgres
spring.datasource.password=sabrine123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# IFC File
# =========================
building.ifc.path=data/otc.ifc
building.mapping.path=data/mapping_final.json
building.ifc.enriched.path=data/otc.enriched.ifc

# =========================
# WaveOn Fusion API
# =========================
building.fusion-api.enabled=true
building.fusion-api.base-url=https://iot.waveon.tn/WS_WAVEON
building.fusion-api.proxy-prefix=/proxy/:81
building.fusion-api.auth-base-url=https://iot.waveon.tn/WS_WAVEON
building.fusion-api.login-path=/LoginClientService/

# Mode session statique — remplacer le token ci-dessous après chaque expiration
# Obtenir un token frais : POST https://iot.waveon.tn/WS_WAVEON/LoginClientService/
# avec { "email":"...", "password":"...", "devicename":"..." } (Content-Type: application/json)
#building.fusion-api.static-id-client=171
#building.fusion-api.static-id-user=4
#building.fusion-api.static-token=FuRXSBz9jFY3NGfgsIUY

# Mode login dynamique (décommenter pour obtenir un token frais automatiquement)
building.fusion-api.email=amal.waly@etudiant-isi.utm.tn
building.fusion-api.password=8Sw5BCV1DybTyxxHGVYXXg==

building.fusion-api.device-name=372e7fa799d94aac
building.fusion-api.default-sync-timestamp=2019-10-01 01:01:01
building.fusion-api.energy-parameter=tae
building.fusion-api.flow-parameter=flow_rate
building.fusion-api.realtime-lookback-hours=24
building.fusion-api.connect-timeout-ms=10000
building.fusion-api.read-timeout-ms=30000

# =========================
# Kafka — Producer
# =========================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =========================
# Kafka — Consumer
# =========================
spring.kafka.consumer.group-id=building-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.digitaltwin.building_service.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.digitaltwin.building_service.kafka.SensorReadingEvent

# =========================
# Kafka — Topic & Polling
# =========================
building.kafka.topic=building.sensor.readings
building.kafka.polling-interval-ms=300000
building.kafka.initial-delay-ms=15000
